# ─────────────────────────────────────────────────────
# STARSHIP PROMPT — Darky Configuration
# ***File: ~/.config/starship.toml***
# ─────────────────────────────────────────────────────
# ***Install: curl -sS https://starship.rs/install.sh | sh***
# ***Enable:  echo 'eval "$(starship init zsh)"' >> ~/.zshrc***
# ─────────────────────────────────────────────────────

"$schema" = 'https://starship.rs/config-schema.json'
scan_timeout = 30

format = """
$directory\
$git_branch\
$git_status\
$python\
$rust\
$golang\
$nodejs\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true

palette = "darky-blue"

# ─── Prompt palettes ──────────────────────────
# install.sh rewrites the `palette` line above to the theme you picked, so the
# prompt always matches the terminal. Every style below uses these names.
[palettes.darky-blue]
primary    = "#A8C7FA"
secondary  = "#C5DAFF"
highlight  = "#D7E7FF"
text       = "#F3F7FD"
muted      = "#D8E3F3"
bg         = "#151C24"
danger     = "#F08282"
success    = "#8CD2A0"
warning    = "#E6C88C"
dim        = "#6B7FA0"

[palettes.darky-orange]
primary    = "#F0935F"
secondary  = "#FFB489"
highlight  = "#FFD2B0"
text       = "#FAF3EC"
muted      = "#E8DCD0"
bg         = "#1A1310"
danger     = "#F08282"
success    = "#8CD2A0"
warning    = "#E6C88C"
dim        = "#9A7861"

[palettes.darky-purple]
primary    = "#BD93F9"
secondary  = "#D6ACFF"
highlight  = "#E9D6FF"
text       = "#F8F8F2"
muted      = "#D7D7D0"
bg         = "#21222C"
danger     = "#FF6E6E"
success    = "#69FF94"
warning    = "#FFFFA5"
dim        = "#6272A4"

[palettes.darky-green]
primary    = "#9DD6A4"
secondary  = "#C5F0C8"
highlight  = "#DCFBE0"
text       = "#F3FDF4"
muted      = "#D8EDDA"
bg         = "#151C24"
danger     = "#F08282"
success    = "#8CD2A0"
warning    = "#E6C88C"
dim        = "#6E9C78"

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol   = "[❯](bold fg:danger)"
vimcmd_symbol  = "[❮](bold fg:secondary)"

[directory]
style                     = "bold fg:secondary"
truncation_length         = 3
truncate_to_repo          = true
read_only                 = " ro"
read_only_style           = "fg:danger"
before_repo_root_style    = "fg:dim"
repo_root_style           = "bold fg:highlight"
format                    = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol    = ""
style     = "fg:dim"
format    = "[$symbol$branch]($style) "

[git_status]
style     = "fg:danger"
format    = "([$all_status$ahead_behind]($style) )"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "~${count}"
staged    = "+${count}"
untracked = "?${count}"
deleted   = "-${count}"

[fill]
symbol = " "

[cmd_duration]
min_time          = 2000
style             = "fg:dim"
format            = "[$duration]($style) "
show_milliseconds = false

[time]
disabled      = false
style         = "fg:dim"
format        = "[$time]($style)"
time_format   = "%H:%M"
use_12hr      = false

[python]
symbol = "py "
style  = "fg:success"
format = "[$symbol($version)]($style) "

[rust]
symbol = "rs "
style  = "fg:warning"
format = "[$symbol($version)]($style) "

[golang]
symbol = "go "
style  = "fg:success"
format = "[$symbol($version)]($style) "

[nodejs]
symbol = "js "
style  = "fg:warning"
format = "[$symbol($version)]($style) "

# ─────────────────────────────────────────────────────
# ZSH CONFIGURATION — Darky
# Append to: ~/.zshrc
# ─────────────────────────────────────────────────────

# --- Aliases ---
# alias ls='ls --color=auto --group-directories-first'
# alias ll='ls -lh'
# alias la='ls -lAh'
# alias grep='grep --color=auto'
# alias diff='diff --color=auto'

# --- Plugins (install via DNF or manually) ---
# source /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
# source /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh

# --- Startup ---
# fastfetch --config ~/.config/fastfetch/config.jsonc
